name: notegenie_ai
description: "NoteGenie AI — Fully offline, AI-powered note-taking mobile app optimized for 3GB RAM Android devices."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI, Typography & Layout (Phase 1)
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0

  # State Management & Utilities (Phase 1 & 2)
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

  # Local Offline Database — SQLite + Drift (Phase 2)
  sqflite: ^2.3.3+1
  drift: ^2.20.3
  drift_sqflite: ^2.0.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Rich Text Editor (Phase 2)
  flutter_quill: ^10.5.0

  # File Handling, Compression & Export (Phase 3 & 6)
  pdf: ^3.11.1
  docx_template: ^0.4.0
  archive: ^3.6.1
  excel: ^4.0.6
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image: ^4.2.0

  # Local Offline AI Engine — llama.cpp via Dart FFI (Phase 4)
  ffi: ^2.1.3
  llama_cpp_dart: ^0.1.0
  shared_preferences: ^2.3.2

  # Offline OCR, Bengali STT & Native TTS (Phase 5)
  google_mlkit_text_recognition: ^0.13.1
  vosk_flutter: ^0.3.48
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Phase 4 & 5 offline assets (gguf models & vosk-model-small-bn)
    # - assets/models/
